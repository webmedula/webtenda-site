name: Deploy webtenda.com.br

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/webtenda.com.br/public_html' }}
    steps:
      - name: Verificar secrets
        id: check
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::warning::Secrets SSH_HOST, SSH_USER e SSH_KEY ainda não configurados. Deploy pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - name: Configurar SSH
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "Impressão digital da chave (deve bater com a do servidor):"
          ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub || { echo "::error::SSH_KEY não é uma chave privada válida. Cole de novo, da linha BEGIN até END."; exit 1; }
          ssh-keygen -lf ~/.ssh/id_deploy.pub
          echo "Usuário: $SSH_USER" | sed 's/./& /g'
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Versionar CSS e JS (evita cache antigo no navegador)
        if: steps.check.outputs.ok == 'true'
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#href=\"style\.css(\?v=[^\"]*)?\"#href=\"style.css?v=$V\"#; s#src=\"main\.js(\?v=[^\"]*)?\"#src=\"main.js?v=$V\"#" index.html
          grep -nE "style\.css|main\.js" index.html

      - name: Enviar arquivos
        if: steps.check.outputs.ok == 'true'
        run: |
          rsync -avz --checksum \
            --exclude '.git*' --exclude '.github' --exclude 'README.md' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
